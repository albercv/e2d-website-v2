<title>E2D — Mapa de Arquitectura 3D</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --page: #f4f4f1; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --c-web: #2a78d6; --c-api: #eb6834; --c-service: #1baf7a; --c-job: #eda100;
  --c-mcp: #e87ba4; --c-data: #008300; --c-auth: #4a3aa7; --c-external: #e34948;
  --c-infra: #898781; --sel: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0b0b10; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
    --c-web: #3987e5; --c-api: #d95926; --c-service: #199e70; --c-job: #c98500;
    --c-mcp: #d55181; --c-data: #008300; --c-auth: #9085e9; --c-external: #e66767;
    --c-infra: #898781; --sel: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0b0b10; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
  --c-web: #3987e5; --c-api: #d95926; --c-service: #199e70; --c-job: #c98500;
  --c-mcp: #d55181; --c-data: #008300; --c-auth: #9085e9; --c-external: #e66767;
  --c-infra: #898781; --sel: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--ink); display: flex; flex-direction: column;
  overflow: hidden;
}
header.appbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--grid);
  z-index: 5;
}
header.appbar h1 { font-size: 16px; margin: 0; font-weight: 650; }
header.appbar .meta { color: var(--muted); font-size: 12px; }
header.appbar .spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls input[type="search"] {
  padding: 6px 10px; border: 1px solid var(--baseline); border-radius: 8px;
  background: var(--page); color: var(--ink); min-width: 170px; font: inherit;
}
.btn {
  padding: 6px 10px; border: 1px solid var(--baseline); border-radius: 8px;
  background: var(--surface-1); color: var(--ink); cursor: pointer; font: inherit;
  text-decoration: none; display: inline-flex; align-items: center;
}
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { outline: 2px solid var(--sel); }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; }
#c3d { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#c3d.dragging { cursor: grabbing; }
#legend {
  position: absolute; left: 12px; top: 12px;
  background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  border: 1px solid var(--grid); border-radius: 10px;
  padding: 8px 10px; font-size: 12px; max-width: 200px; backdrop-filter: blur(4px);
}
#legend .lg-title { font-weight: 650; margin-bottom: 4px; }
#legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 0; color: var(--ink-2); }
#legend .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 11.5px; pointer-events: none; }
#side {
  width: 360px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--surface-1); border-left: 1px solid var(--grid);
}
#side .tabs { display: flex; border-bottom: 1px solid var(--grid); }
#side .tabs button {
  flex: 1; padding: 9px 6px; border: 0; background: none; color: var(--ink-2);
  cursor: pointer; font: inherit; font-weight: 600; border-bottom: 2px solid transparent;
}
#side .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sel); }
#side .panel { flex: 1; overflow: auto; padding: 12px; display: none; }
#side .panel.active { display: block; }
.flow-item { border: 1px solid var(--grid); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
.flow-item:hover { border-color: var(--ink-2); }
.flow-item.selected { border-color: var(--sel); outline: 1px solid var(--sel); }
.flow-item h3 { margin: 0 0 3px; font-size: 13.5px; }
.flow-item .trigger { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--ink-2); }
.flow-item p { margin: 4px 0 0; color: var(--ink-2); font-size: 12.5px; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 650;
  border: 1px solid var(--baseline); color: var(--ink-2); vertical-align: 1px;
}
.badge.high { border-color: #0ca30c; color: #0ca30c; }
.badge.medium { border-color: #fab219; color: #a97400; }
:root[data-theme="dark"] .badge.medium { color: #fab219; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.medium { color: #fab219; } }
.badge.low { border-color: #d03b3b; color: #d03b3b; }
.steps { margin: 8px 0 0; padding: 0; list-style: none; }
.steps li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--grid); font-size: 12.5px; }
.steps .n {
  flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--sel); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.steps .who { font-weight: 650; }
.ev { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
#detail h2 { margin: 0 0 2px; font-size: 15px; }
#detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
#detail dl { margin: 0; font-size: 12.5px; }
#detail dt { font-weight: 650; margin-top: 8px; color: var(--ink-2); }
#detail dd { margin: 2px 0 0; }
#detail ul { margin: 2px 0 0; padding-left: 16px; }
.placeholder { color: var(--muted); font-size: 12.5px; }
#limits h2 { font-size: 14px; margin: 0 0 6px; }
#limits h3 { font-size: 12.5px; margin: 12px 0 4px; color: var(--ink-2); }
#limits ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
#limits li { margin: 3px 0; }
#sideToggle { display: none; }
@media (max-width: 900px) {
  #side {
    position: fixed; right: 0; top: 0; bottom: 0; z-index: 30; width: min(92vw, 360px);
    transform: translateX(100%); transition: transform .2s ease; box-shadow: -4px 0 16px var(--ring);
  }
  #side.open { transform: none; }
  #sideToggle { display: inline-block; }
  #legend { max-width: 150px; font-size: 11px; }
}
</style>

<header class="appbar">
  <h1>E2D — Arquitectura 3D</h1>
  <span class="meta" id="metaLine"></span>

    <a class="btn" href="/admin/architecture" title="Vista 2D">▦ 2D</a>
    <button class="btn" id="sideToggle" aria-expanded="false">Panel</button>
  </div>
</header>
<main>

  </div>
  <aside id="side">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="flows">Flujos</button>
      <button role="tab" aria-selected="false" data-tab="detail">Componente</button>
      <button role="tab" aria-selected="false" data-tab="limits">Limitaciones</button>
    </div>
    <div class="panel active" id="flows" role="tabpanel"></div>
    <div class="panel" id="detail" role="tabpanel"><p class="placeholder">Haz clic en un orbe para ver sus detalles y evidencias.</p></div>
    <div class="panel" id="limits" role="tabpanel"></div>
  </aside>
</main>

    lastInteract = performance.now();
    if (drag) {
      var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      cam.yaw = drag.yaw + dx * 0.005;
      cam.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + dy * 0.005));
      dirty = true;
    } else {
      var hit = pick(ev);
      if ((hit && hit.id) !== hoverNode) { hoverNode = hit ? hit.id : null; dirty = true; }
      canvas.style.cursor = hit ? "pointer" : "";
    }
  });
  canvas.addEventListener("pointerup", function (ev) {
    canvas.classList.remove("dragging");
    var wasDrag = drag && drag.moved;
    drag = null;
    if (!wasDrag) {
      var hit = pick(ev);
      if (hit) selectNode(hit.id); else clearSelection();
    }
  });
  canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    lastInteract = performance.now();
    cam.dist = Math.max(420, Math.min(FIT_DIST * 2.2, cam.dist * (ev.deltaY > 0 ? 1.1 : 1 / 1.1)));
    dirty = true;
  }, { passive: false });

  function pick(ev) {
    var r = canvas.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var best = null, bestD = 1e9;
    DATA.nodes.forEach(function (n) {
      var p = lastProj[n.id];
      if (!p || isDimmed(n)) return;
      var rad = n._r * p.s * 1.6 + 5;
      var d = Math.hypot(p.x - mx, p.y - my);
      if (d < rad && p.z < bestD) { bestD = p.z; best = n; }
    });
    return best;
  }

  document.getElementById("zoomIn").addEventListener("click", function () { cam.dist = Math.max(420, cam.dist / 1.2); dirty = true; });
  document.getElementById("zoomOut").addEventListener("click", function () { cam.dist = Math.min(FIT_DIST * 2.2, cam.dist * 1.2); dirty = true; });
  document.getElementById("resetView").addEventListener("click", function () {
    clearSelection(); cam.yaw = 0.9; cam.pitch = 0.28; cam.dist = FIT_DIST; dirty = true;
  });
  var autoBtn = document.getElementById("autoRotate");
  autoBtn.addEventListener("click", function () {
    auto = !auto; autoBtn.setAttribute("aria-pressed", String(auto)); lastInteract = 0; dirty = true;
  });

  /* ------------------------------------------------------------ leyenda */
  var legendItems = document.getElementById("legendItems");
  refreshColors();
  Object.keys(GROUP_LABEL).forEach(function (gid) {
    if (!DATA.nodes.some(function (n) { return n._group === gid; })) return;
    activeGroups[gid] = true;
    var lab = document.createElement("label");
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    cb.addEventListener("change", function () { activeGroups[gid] = cb.checked; dirty = true; });
    var chip = document.createElement("span");
    chip.className = "chip"; chip.style.background = "var(" + GROUP_VAR[gid] + ")"; chip.style.color = "var(" + GROUP_VAR[gid] + ")";
    lab.appendChild(cb); lab.appendChild(chip); lab.appendChild(document.createTextNode(GROUP_LABEL[gid]));
    legendItems.appendChild(lab);
  });
  document.getElementById("search").addEventListener("input", function (ev) {
    searchQ = ev.target.value.trim().toLowerCase(); dirty = true;
  });

  /* --------------------------------------------------------- side panel */
  var side = document.getElementById("side");
  document.getElementById("sideToggle").addEventListener("click", function () {
    side.classList.toggle("open");
    this.setAttribute("aria-expanded", side.classList.contains("open") ? "true" : "false");
  });
  var tabs = side.querySelectorAll(".tabs button");
  function showTab(id) {
    tabs.forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === id ? "true" : "false"); });
    side.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("active", p.id === id); });
  }
  tabs.forEach(function (b) { b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); }); });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function evList(evs) {
    if (!evs || !evs.length) return "";
    return '<div class="ev">' + evs.map(function (e) {
      return esc(e.path) + (e.symbol ? " · " + esc(e.symbol) : "") + (e.lines ? " · L" + esc(e.lines) : "");
    }).join("<br>") + "</div>";
  }

  function clearSelection() {
    selNode = null; selFlow = null; flowNodeSet = {}; flowEdgeSet = {}; flowGhost = [];
    side.querySelectorAll(".flow-item").forEach(function (f) { f.classList.remove("selected"); });
    dirty = true;
  }

  function selectNode(id) {
    selFlow = null; flowNodeSet = {}; flowEdgeSet = {}; flowGhost = [];
    side.querySelectorAll(".flow-item").forEach(function (f) { f.classList.remove("selected"); });
    selNode = id; dirty = true;
    var n = nodeById[id];
    var files = (n.sourceFiles || []).map(function (f) {
      return "<li><span class='ev'>" + esc(f.path) + (f.symbol ? " · " + esc(f.symbol) : "") + (f.lines ? " · L" + esc(f.lines) : "") + "</span></li>";
    }).join("");
    document.getElementById("detail").innerHTML =
      "<h2>" + esc(n.label) + "</h2>" +
      "<div class='sub'>" + esc(n.type) + " · módulo <b>" + esc(n.module || "—") + "</b> · " +
      "<span class='badge " + esc(n.confidence) + "'>" + esc(n.confidence) + "</span></div>" +
      "<dl><dt>Descripción</dt><dd>" + esc(n.description || n.tooltip || "—") + "</dd>" +
      "<dt>Archivos de origen</dt><dd><ul>" + (files || "<li class='placeholder'>—</li>") + "</ul></dd>" +
      (n.notes && n.notes.length ? "<dt>Notas / limitaciones</dt><dd><ul>" + n.notes.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></dd>" : "") +
      "</dl>";
    showTab("detail");
    if (window.innerWidth <= 900) side.classList.add("open");
  }

  var flowsPanel = document.getElementById("flows");
  DATA.flows.forEach(function (f) {
    var div = document.createElement("div");
    div.className = "flow-item";
    div.innerHTML =
      "<h3>" + esc(f.name) + " <span class='badge " + esc(f.confidence) + "'>" + esc(f.confidence) + "</span></h3>" +
      "<div class='trigger'>" + esc(f.trigger) + "</div>" +
      "<p>" + esc(f.description) + "</p>" +
      "<ol class='steps' style='display:none'>" +
      f.steps.map(function (s) {
        var n = nodeById[s.nodeId];
        return "<li><span class='n'>" + s.order + "</span><div><div class='who'>" + esc(n ? n.label : s.nodeId) + "</div>" +
          "<div>" + esc(s.action) + "</div>" + evList(s.evidence) + "</div></li>";
      }).join("") + "</ol>";
    div.addEventListener("click", function () { selectFlow(f, div); });
    flowsPanel.appendChild(div);
  });

  function selectFlow(f, div) {
    var was = selFlow === f.id;
    clearSelection();
    flowsPanel.querySelectorAll(".steps").forEach(function (s) { s.style.display = "none"; });
    if (was) return;
    selNode = null; selFlow = f.id;
    div.classList.add("selected");
    div.querySelector(".steps").style.display = "";
    f.steps.forEach(function (s) { flowNodeSet[s.nodeId] = true; });
    for (var i = 0; i < f.steps.length - 1; i++) {
      var a = f.steps[i].nodeId, b = f.steps[i + 1].nodeId, found = false;
      DATA.edges.forEach(function (e) {
        if ((e.source === a && e.target === b) || (e.source === b && e.target === a)) {
          flowEdgeSet[e.id] = true; found = true;
        }
      });
      if (!found) flowGhost.push([a, b]);
    }
    dirty = true;
    showTab("flows");
  }

  /* -------------------------------------------------------- limitaciones */
  var lim = document.getElementById("limits");
  var softEdges = DATA.edges.filter(function (e) { return e.confidence !== "high"; });
  var softNodes = DATA.nodes.filter(function (n) { return n.confidence !== "high"; });
  lim.innerHTML =
    "<h2>Limitaciones del análisis</h2>" +
    "<h3>Relaciones con confianza media/baja (" + softEdges.length + ")</h3><ul>" +
    (softEdges.map(function (e) {
      return "<li><b>" + esc((nodeById[e.source] || {}).label || e.source) + " → " + esc((nodeById[e.target] || {}).label || e.target) + "</b> " +
        "<span class='badge " + esc(e.confidence) + "'>" + esc(e.confidence) + "</span>" +
        (e.notes && e.notes.length ? "<br>" + esc(e.notes.join(" ")) : "") + "</li>";
    }).join("") || "<li>Ninguna.</li>") + "</ul>" +
    (softNodes.length ? "<h3>Nodos con confianza media/baja</h3><ul>" +
      softNodes.map(function (n) { return "<li><b>" + esc(n.label) + "</b></li>"; }).join("") + "</ul>" : "") +
    "<h3>Comportamiento dinámico no verificable</h3><ul>" +
    ((META.limitations && META.limitations.dynamic) || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
    "<h3>Directorios excluidos</h3><ul>" +
    ((META.excludedDirs) || []).map(function (x) { return "<li><span class='ev'>" + esc(x) + "</span></li>"; }).join("") + "</ul>" +
    "<h3>Puntos ciegos del análisis estático</h3><ul>" +
    ((META.limitations && META.limitations.blindSpots) || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";

  /* ----------------------------------------------------------------- go */
  document.getElementById("metaLine").textContent =
    (META.snapshotCommit ? "commit " + META.snapshotCommit.slice(0, 10) : "") +
    " · " + DATA.nodes.length + " nodos · " + DATA.edges.length + " aristas · " + DATA.flows.length + " flujos";
  window.addEventListener("resize", resize);
  resize();
  if (ctx) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
